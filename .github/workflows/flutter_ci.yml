name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality_gate:
    name: AI Maintainer Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8

      - name: Setup template Firebase config for CI
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run AI maintainer quality gate
        run: dart run tool/verify_invariants.dart

